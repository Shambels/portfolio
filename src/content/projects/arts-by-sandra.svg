<svg class="sig sig-arts-by-sandra" viewBox="0 0 216 160" xmlns="http://www.w3.org/2000/svg">
<!-- Arts by Sandra: three conversations — a phone call, an Instagram message,
     word of mouth — in three languages, funnelled into the one form she answers. -->
<style>
.sig-arts-by-sandra text { font: 400 8px var(--mono); fill: var(--paper-dim); }
.sig-arts-by-sandra .thread { fill: none; stroke: var(--paper-faint); stroke-width: 1.2; stroke-dasharray: 100; }
.sig-arts-by-sandra .thread.last { stroke: var(--gold); }
.sig-arts-by-sandra .form { fill: var(--ink-2); stroke: #ffffff33; }
.sig-arts-by-sandra .field { fill: #ffffff14; }
.sig-arts-by-sandra .send { fill: var(--gold); }
@keyframes sig-draw { from { stroke-dashoffset: 100; } }
.entry:is(:hover, :focus-within) .sig-arts-by-sandra .thread { animation: sig-draw 0.9s calc(var(--i) * 120ms) both cubic-bezier(0.4, 0, 0.2, 1); }
</style>
<text x="14" y="38">☎  FR</text>
<text x="14" y="84">@  NL</text>
<text x="14" y="130">“”  EN</text>
<path class="thread" pathLength="100" style="--i:0" d="M58 35 C98 35 104 72 138 76"/>
<path class="thread" pathLength="100" style="--i:1" d="M58 81 C96 81 110 80 138 80"/>
<path class="thread last" pathLength="100" style="--i:2" d="M62 127 C102 127 104 88 138 84"/>
<rect class="form" x="138" y="46" width="64" height="70" rx="4"/>
<rect class="field" x="146" y="56" width="48" height="8" rx="2"/>
<rect class="field" x="146" y="70" width="48" height="8" rx="2"/>
<rect class="field" x="146" y="84" width="48" height="12" rx="2"/>
<rect class="send" x="146" y="102" width="26" height="7" rx="2"/>
</svg>
