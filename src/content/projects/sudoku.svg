<svg class="sig sig-sudoku" viewBox="0 0 216 160" xmlns="http://www.w3.org/2000/svg">
<!-- The Sudoku Solver's puzzle — the repository's own main() board, as src/sudoku.ts has it:
     31 clues, and every open cell's remaining candidates as pencil marks, which is
     possibleEntries seen rather than counted. On hover the clues settle in the solver's
     scan order. sudoku.check.ts holds every digit here to PUZZLE and candidates(). -->
<style>
.sig-sudoku .grid path { fill: none; stroke: #ffffff12; stroke-width: 0.6; }
.sig-sudoku .grid .box { stroke: color-mix(in srgb, var(--gold) 40%, transparent); stroke-width: 0.9; }
.sig-sudoku .k { font: 600 10px var(--mono); fill: var(--gold); text-anchor: middle; dominant-baseline: central; transform-box: fill-box; transform-origin: center; }
.sig-sudoku .m { font: 400 3.6px var(--mono); fill: #7fd4e0; opacity: 0.5; text-anchor: middle; dominant-baseline: central; }
@keyframes sig-settle { from { opacity: 0; transform: scale(1.8); } }
@keyframes sig-flicker { 50% { opacity: 0.1; } }
.entry:is(:hover, :focus-within) .sig-sudoku .k { animation: sig-settle 0.35s calc(var(--i) * 28ms) both cubic-bezier(0.2, 0.7, 0.3, 1); }
.entry:is(:hover, :focus-within) .sig-sudoku .m { animation: sig-flicker 1.4s infinite; }
.entry:is(:hover, :focus-within) .sig-sudoku .m:nth-of-type(3n) { animation-delay: -0.5s; }
.entry:is(:hover, :focus-within) .sig-sudoku .m:nth-of-type(2n) { animation-delay: -0.9s; }
</style>
