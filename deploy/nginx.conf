# /etc/nginx/sites-available/pinchs.be
# Static prerendered site. Does the two jobs Cloudflare's `_redirects` did:
# send `/` to a locale, and serve the prerendered 404 with a 404 status.
#
# The server's address is not written down here. `server_name` is the two names
# DNS points at the box; anything arriving by bare IP, or with a Host header
# nobody recognises, hits the catch-all below and gets nothing back.

# 444 is nginx's non-standard "close the connection, send no response" — cheaper
# than a 403 and it gives a scanner no fingerprint to file. After certbot has
# run, the same block wants a `listen 443 ssl default_server` twin with a
# self-signed cert; until then this is the whole of it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name pinchs.be www.pinchs.be;

    root /var/www/pinchs.be;
    index index.html;

    # Drops the version from the Server header and from error pages. It stops
    # nobody who is looking at *you*; it takes the box out of the results when
    # somebody searches for every host running one particular nginx.
    server_tokens off;

    # The CSP, once, as a variable — `add_header` does not merge across levels,
    # so any location that sets a header of its own has to restate the ones it
    # wants, and this keeps that from being three copies of a long string.
    #
    # It is deliberately honest about what a prerendered React Router app
    # needs. `script-src` carries `'unsafe-inline'` because the build bakes
    # five inline <script> blocks into every page — the router context, the
    # module preamble and the hydration stream — whose hashes change on every
    # build, and a nonce is impossible when the HTML is a file on disk rather
    # than a response. That leaves the CSP saying little about XSS, which is
    # tolerable here only because there is no user input on the site to inject
    # through: no forms, no query rendering, no backend. The directives still
    # doing real work are `object-src`, `base-uri` and `frame-ancestors`.
    #
    # `blob:` is three's worker and texture paths, `wasm-unsafe-eval` its
    # transcoders — both bundled, both reachable, and both silent when blocked.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob:; font-src 'self'";

    # Inherited by every location that sets no `add_header` of its own — which
    # is `= /` and the 404, but not the two below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;

    # No Accept-Language negotiation: hreflang tells search engines the rest,
    # and a static redirect is one line instead of a map block.
    location = / { return 302 /en; }

    # Filenames are content-hashed by the build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Restated, not inherited. Scripts and .glb served with a guessed type
        # is the one of the four that means anything on a subresource.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # `/en` -> `/en/index.html`, no trailing-slash redirect.
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        # Restated, not inherited — this location serves the HTML.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json model/gltf-binary;
}
